/* Vision Design System (React) — components/bundle.css.
   Assembled from the project's stylesheets (styles.css → tokens/*.css, assets/icons/vision-icons.css).
   Colors, shadows, spacing, radii, sizes, font families, type styles and the icon @font-face now live in
   tokens.json (compiled to tokens.css, loaded before this file). What stays here is what the page does not
   declare: the Google Fonts import, element defaults, typography/motion variables, the icon glyph classes,
   and the class/attribute-scoped theme blocks (.vision-light, .vision-dark, [data-mode="dark"]) that the
   bundle and the UI kits switch on. */


/* ---- typography variables (tailwind.config.js fontSize scale) ---- */
/* Source: tailwind.config.js fontSize scale. Headings weight 500, paragraphs weight 400. Single family: Inter. */
:root{
  --text-h1:22px;--lh-h1:normal;/* @kind other */
  --text-h2:18px;--lh-h2:normal;/* @kind other */
  --text-h3:16px;--lh-h3:normal;/* @kind other */
  --text-h4:14px;--lh-h4:normal;/* @kind other */
  --text-h5:12px;--lh-h5:130%;/* @kind other */
  --text-h6:10px;--lh-h6:120%;/* @kind other */
  --text-p1:18px;--lh-p1:140%;/* @kind other */
  --text-p2:14px;--lh-p2:140%;/* @kind other */
  --text-p3:12px;--lh-p3:140%;/* @kind other */
  --text-p4:10px;--lh-p4:130%;/* @kind other */
  --text-p5:8px;--lh-p5:120%;/* @kind other */
  --text-overlay:10px;--lh-overlay:120%;/* @kind other */
  --text-base:14px;--lh-base:140%;/* @kind other */
  --weight-regular:400;--weight-medium:500;--weight-semibold:600;
}

/* ---- motion, opacity, grid (component CSS) ---- */
/* Shadows from tailwind.config.js boxShadow; motion from component CSS. */
:root{
  --ease-standard:ease-in-out;/* @kind other */--duration-standard:300ms;/* @kind other */         /* buttons: transition 300ms ease-in-out */
  --ease-pop:cubic-bezier(0.16,1,0.3,1);/* @kind other */--duration-pop:400ms;/* @kind other */    /* menus/popovers slide+fade */
  --ease-collapse:cubic-bezier(0.87,0,0.13,1);/* @kind other */--duration-collapse:300ms;/* @kind other */
  --ease-progress:cubic-bezier(0.65,0,0.35,1);/* @kind other */--duration-progress:660ms;/* @kind other */
  --opacity-disabled:0.4;/* @kind other */
  --grid-columns:12;/* @kind other */ /* from tokens/spacing.css */
  --overlay:var(--separations-overlay);
}

.vision-light, .vision-light-theme {

/* ---- fix: ToolbarComboButton overflow chevron ----
   The ported Popover wraps its trigger in a position:relative span, so the absolutely positioned
   .fw-toolbar-combo-more chevron was placed beside the 50px button instead of on its edge
   (the source uses Radix, which adds no wrapper). Let the wrapper cover the combo box and pass
   pointer events through to the button beneath it; only the chevron and the open list stay clickable. */
.fw-toolbar-combo > .fw-popover-wrap { position: absolute; inset: 0; display: block; pointer-events: none; }
.fw-toolbar-combo > .fw-popover-wrap > span { display: contents; }
.fw-toolbar-combo > .fw-popover-wrap .fw-toolbar-combo-more,
.fw-toolbar-combo > .fw-popover-wrap .fw-popover { pointer-events: auto; }

/* ---- ToolbarComboButton menu control (Figma Viewer-3.0 · Menu Control, 104472-110998) ----
   The side trigger is a 10×40 strip centred on the 50px button, not a full-height 10×50 one. At rest the
   16px chevron sits 2px toward the button; on hover it slides to centre (50ms) over a vertical gradient
   that peaks at the middle, with a hairline on the button side. A selected (Focused) button uses the
   denser gradient. Chevron ink: typography-light at rest, typography-base on hover; sidebar-base (fixed navy) on a selected button. */
.fw-toolbar-combo-more-left, .fw-toolbar-combo-more-right { top: 5px; height: 40px; width: 10px; overflow: visible; }
.fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-more-right .fw-icon { transition: transform 50ms ease-out; color: var(--typography-light); }
.fw-toolbar-combo-more-left .fw-icon { transform: translateX(2px); }
.fw-toolbar-combo-more-right .fw-icon { transform: translateX(-2px); }
.fw-toolbar-combo-more-left:hover .fw-icon, .fw-toolbar-combo-more-right:hover .fw-icon { transform: translateX(0); color: var(--typography-base); }
.fw-toolbar-combo-more-left:hover, .fw-toolbar-combo-more-right:hover {
  background: linear-gradient(180deg, rgba(118,164,252,0) 0%, rgba(118,164,252,0.15) 50%, rgba(118,164,252,0) 100%);
}
.fw-toolbar-combo-more-left:hover { border-right: 1px solid rgba(64,94,151,0.05); }
.fw-toolbar-combo-more-right:hover { border-left: 1px solid rgba(64,94,151,0.05); }
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left .fw-icon, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right .fw-icon,
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left:hover .fw-icon, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right:hover .fw-icon { color: var(--sidebar-base); }
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left:hover, .fw-toolbar-combo-selected .fw-toolbar-combo-more-right:hover {
  background: linear-gradient(180deg, rgba(91,131,206,0) 0%, rgba(91,131,206,0.8) 51.442%, rgba(91,131,206,0) 100%);
}
.fw-toolbar-combo-selected .fw-toolbar-combo-more-left:hover { border-right-color: rgba(30,49,84,0.05); }
.fw-toolbar-combo-selected .fw-toolbar-combo-more-right:hover { border-left-color: rgba(30,49,84,0.05); }

/* ---- Chip sizing (Figma Vision Design System · Chips, 4964-73403) ----
   Chip/Outlined is a fixed 24px: 1px border, 4px container padding, 16px icon/avatar/close, text 12px at
   line-height 1.2 with 6px side padding; the count beside the title is regular weight in typography-light
   (white at 60% on a filled chip). The port's 140% line-height + 16px min-height made the chip ~23px and the
   text sit low; compact keeps its 14px inner cap. */
.fw-chip { height: 24px; }
.fw-chip .fw-chip-inner { padding: 0 4px; height: 100%; box-sizing: border-box; gap: 0; }
.fw-chip .fw-chip-inner > .fw-icon:first-child { margin-left: 2px; }
.fw-chip .fw-chip-text { line-height: 1.2; min-height: 0; margin: 0; padding: 0 6px; }
.fw-chip .fw-chip-close { margin: 0; }
.fw-chip-text b { font-weight: 600; }
.fw-chip-on .fw-chip-text span { color: inherit; opacity: .6; }
.fw-chip-compact { height: auto; }
.fw-chip-compact .fw-chip-inner { max-height: 14px; padding: 2px; }

/* ---- Stepper knockout surface (vision-react FwStep `variant`) ----
   Each step paints a solid patch behind its number and text to hide the connector line that runs behind the row.
   The patch must match the surface the stepper sits on; `variant` picks it (page-light default, as in the source). */
.fw-step-bg-page-shaded .fw-step-content, .fw-step-bg-page-shaded .fw-step-deco { background: var(--page-shaded); border-color: var(--page-shaded); }
.fw-step-bg-card-header .fw-step-content, .fw-step-bg-card-header .fw-step-deco { background: var(--card-header); border-color: var(--card-header); }
.fw-step-bg-card-background .fw-step-content, .fw-step-bg-card-background .fw-step-deco { background: var(--card-background); border-color: var(--card-background); }
.fw-step-bg-inherit .fw-step-content, .fw-step-bg-inherit .fw-step-deco { background: transparent; border-color: transparent; }

/* ---- DateInput picker icon ----
   The native date control draws the browser's own calendar glyph. Hide it (keep it clickable so the picker still
   opens) and draw the library's calendar-schedule glyph over the same spot in primary-base. */
.fw-date .fw-input-box { position: relative; }
.fw-date input[type=date]::-webkit-calendar-picker-indicator,
.fw-date input[type=datetime-local]::-webkit-calendar-picker-indicator,
.fw-date input[type=time]::-webkit-calendar-picker-indicator { opacity: 0 !important; width: 22px; height: 22px; margin-left: .5rem; cursor: pointer; }
.fw-date .fw-input-box::after { content: "\e97d"; font-family: "Flywheel-Vision-Icons"; font-size: 22px; line-height: 1; color: var(--primary-base); position: absolute; right: 8px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.fw-date .fw-input-box:has(input[type=time])::after { content: "\ea32"; }
.fw-date .fw-input-box:has(input:disabled)::after { color: var(--typography-disabled); }

/* Project Status — app layout on Vision tokens */
html, body, #root { min-height: 100%; }
body { margin: 0; background: var(--page-shaded); color: var(--typography-base); font-family: var(--font-sans); font-size: 14px; line-height: 140%; }
* { box-sizing: border-box; }
a { color: var(--primary-base); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
#fw-mark { display: none; }

.psd-top { position: sticky; top: 0; z-index: 500; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  min-height: 60px; padding: 8px 16px; background: var(--card-background); border-bottom: 1px solid var(--separations-base); }
html.fw-embedded:not(.fw-own-close) .psd-top { padding-right: calc(16px + 48px); }
.psd-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
.psd-mark { flex-shrink: 0; padding: 6px; width: 36px; height: 36px; border-radius: 8px; background: var(--primary-base); }
.psd-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.psd-viewas { display: flex; align-items: center; gap: 8px; margin-right: 8px; }

.psd-main { display: flex; align-items: flex-start; }
.psd-content { flex: 1; min-width: 0; }
.psd-body { display: flex; flex-direction: column; gap: 16px; padding: 16px; max-width: 1600px; margin: 0 auto; }
.psd-stack { display: flex; flex-direction: column; gap: 16px; padding-top: 16px; }
.psd-foot { padding: 8px 16px 24px; text-align: center; font-size: 11px; color: var(--typography-light); }

.psd-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.psd-kpi { background: var(--card-background); border: 1px solid var(--separations-border); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.psd-kpi-label { font-size: 12px; font-weight: 500; color: var(--typography-muted); }
.psd-kpi-value { font-size: 22px; font-weight: 500; color: var(--typography-base); font-variant-numeric: tabular-nums; }
.psd-kpi-sub { font-size: 12px; color: var(--typography-light); }
.psd-kpi.tone-attention { background: var(--red-hover); border-color: var(--red-border); }
.psd-kpi.tone-attention .psd-kpi-label { color: var(--red-base); }
.psd-kpi.tone-warn { border-color: var(--orange-border); }
.psd-kpi.tone-warn .psd-kpi-label { color: var(--orange-base); }

.psd-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.psd-grid.two > .wide { grid-column: auto; }
@media (max-width: 1100px) { .psd-grid { grid-template-columns: minmax(0, 1fr); } }
.psd-panel { min-width: 0; display: flex; }
.psd-panel.wide { grid-column: 1 / -1; }
.psd-panel .fw-panel, .psd-panel .fw-panel > article { min-width: 0; width: 100%; }
.psd-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-width: 0; }
.psd-panel svg { display: block; overflow: visible; }
.psd-chart { width: 100%; min-width: 0; overflow: hidden; }
.psd-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: 12px; color: var(--typography-muted); }
.psd-legend span { display: inline-flex; align-items: center; gap: 6px; }
.psd-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.psd-table-wrap { border: 1px solid var(--separations-border); border-radius: 8px; overflow: auto; max-height: 380px; background: var(--card-background); }
.psd-table-wrap.tall { max-height: none; }
.psd-table-wrap .fw-table { width: 100%; }
.psd-strong { color: var(--typography-base); font-weight: 500; }
.psd-sub { font-size: 12px; color: var(--typography-light); }
.psd-proj { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.psd-mini { display: flex; align-items: center; gap: 8px; position: relative; }
.psd-mini::before { content: ""; position: absolute; left: 0; width: 80px; height: 6px; border-radius: 3px; background: var(--slate-focus); }
.psd-mini span { display: block; position: relative; height: 6px; border-radius: 3px; min-width: 2px; max-width: 80px; }
.psd-mini em { font-style: normal; margin-left: auto; font-variant-numeric: tabular-nums; }

/* health dots: shape + label, never colour alone */
.h-act, .h-watch, .h-ok, .h-na, .h-off { display: inline-block; width: 10px; height: 10px; flex-shrink: 0; }
.h-act { background: var(--red-base); border-radius: 2px; }
.h-watch { background: var(--orange-base); border-radius: 50% 50% 2px 2px; }
.h-ok { background: var(--green-base); border-radius: 50%; }
.h-na, .h-off { background: var(--slate-border); border-radius: 50%; }
.h-off { border-radius: 2px; }
.psd-lensdot { display: inline-flex; align-items: center; gap: 6px; border: 0; background: transparent; padding: 4px 6px; margin: -4px -6px; border-radius: 4px; font: inherit; font-size: 12px; color: var(--typography-muted); cursor: pointer; }
.psd-lensdot:hover { background: var(--primary-hover); color: var(--typography-base); }

.psd-lens-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 900px) { .psd-lens-strip { grid-template-columns: minmax(0, 1fr); } }
.psd-strip-item { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--separations-border); border-radius: 8px; background: var(--card-background); font-size: 12px; }
.psd-strip-item.active { border-color: var(--primary-base); }
.psd-count { display: inline-flex; align-items: center; gap: 5px; color: var(--typography-muted); }

/* pipeline */
.psd-pipe { display: flex; flex-direction: column; gap: 12px; }
.psd-pipe-step { display: grid; grid-template-columns: 150px 1fr 190px; align-items: center; gap: 12px; }
.psd-pipe-head { display: flex; flex-direction: column; }
.psd-pipe-label { font-size: 13px; font-weight: 500; color: var(--typography-base); }
.psd-pipe-owner { font-size: 11px; color: var(--typography-light); }
.psd-pipe-bar { height: 12px; border-radius: 4px; background: var(--slate-hover); overflow: hidden; }
.psd-pipe-bar span { display: block; height: 100%; border-radius: 4px; }
.psd-pipe-nums { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--typography-muted); }
.psd-pipe-nums b { font-size: 14px; font-weight: 500; color: var(--typography-base); }
.psd-pipe-nums em { font-style: normal; color: var(--orange-base); }
.psd-pipe.compact { gap: 3px; }
.psd-pipe.compact .psd-pipe-step { grid-template-columns: 1fr 40px; gap: 6px; }
.psd-pipe.compact .psd-pipe-head, .psd-pipe.compact .psd-pipe-nums b, .psd-pipe.compact .psd-pipe-nums em { display: none; }
.psd-pipe.compact .psd-pipe-bar { height: 5px; border-radius: 2px; }
.psd-pipe.compact .psd-pipe-nums { font-size: 10px; justify-content: flex-end; }

/* attention */
.psd-att { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.psd-att li { display: grid; grid-template-columns: 92px 1fr auto auto; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--separations-divider, var(--separations-border)); }
.psd-att li:last-child { border-bottom: 0; }
.psd-att-title { font-size: 13px; font-weight: 500; color: var(--typography-base); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.psd-att-proj { font-size: 11px; font-weight: 500; color: var(--typography-light); font-family: ui-monospace, Menlo, monospace; }
.psd-att-detail { font-size: 12px; color: var(--typography-muted); }
.psd-empty { display: flex; align-items: center; gap: 8px; padding: 16px 4px; color: var(--typography-muted); }

/* project */
.psd-phead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.psd-crumb { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--typography-light); margin-bottom: 4px; }
.psd-crumb a { text-decoration: none; }
.psd-pfacts { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: var(--typography-muted); }
.psd-phealth { display: flex; align-items: center; gap: 8px; }
.psd-lenses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 1000px) { .psd-lenses { grid-template-columns: minmax(0, 1fr); } }
.psd-lens { display: flex; flex-direction: column; gap: 14px; padding: 16px; background: var(--card-background); border: 1px solid var(--separations-border); border-radius: 10px; }
.psd-lens.active { border-color: var(--primary-base); box-shadow: 0 0 0 1px var(--primary-base); }
.psd-lens-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.psd-lens-title { display: flex; gap: 10px; align-items: center; }
.psd-lens-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 0; flex: 1; }
.psd-lens-metrics dt { font-size: 11px; color: var(--typography-light); }
.psd-lens-metrics dd { margin: 2px 0 0; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.psd-lens-metrics dd.tone-act { color: var(--red-base); }
.psd-lens-metrics dd.tone-watch { color: var(--orange-base); }
.psd-lens .fw-button { align-self: flex-start; }
.fw-tab-panel { padding-top: 0; }
.fw-tabs .fw-tabs-list { overflow-x: auto; scrollbar-width: none; }

/* info panel */
.psd-info { position: sticky; top: 60px; width: 340px; flex-shrink: 0; height: calc(100vh - 60px); display: flex; flex-direction: column; background: var(--card-background); border-left: 1px solid var(--separations-border); }
.psd-info-head { display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 12px 0 16px; border-bottom: 1px solid var(--separations-base); }
html.fw-embedded:not(.fw-own-close) .psd-info-head { padding-right: calc(12px + 48px); }
.psd-info-body { overflow: auto; padding: 0 16px 24px; }
.psd-info-sec { padding: 14px 0; border-top: 1px solid var(--separations-border); display: flex; flex-direction: column; gap: 8px; }
.psd-info-sec:first-child { border-top: 0; }
.psd-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 12px; }
.psd-kv dt { color: var(--typography-light); }
.psd-kv dd { margin: 0; color: var(--typography-base); word-break: break-word; }
.psd-info-list { margin: 0; padding-left: 16px; font-size: 12px; color: var(--typography-muted); display: flex; flex-direction: column; gap: 6px; }
.psd-info-list.mono { font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
.psd-info-table { width: 100%; border-collapse: collapse; font-size: 11px; color: var(--typography-muted); }
.psd-info-table td { padding: 4px 6px 4px 0; vertical-align: top; border-bottom: 1px solid var(--separations-border); }
.psd-stack.flush { padding-top: 0; }
.fw-tag-title, .psd-lensdot span { white-space: nowrap; }
.psd-table-wrap td { vertical-align: middle; }

/* live vs snapshot provenance */
.psd-src { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 500; letter-spacing: .02em; color: var(--typography-light); white-space: nowrap; }
.psd-src i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.psd-src.src-live i { background: var(--green-base); }
.psd-src.src-snap i { background: transparent; border: 1.5px solid var(--slate-base); width: 7px; height: 7px; }
.psd-kpi-label { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.psd-fresh { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 12px; color: var(--typography-muted); }
.psd-fresh .stale { color: var(--orange-base); }
.psd-phealth { flex-direction: column; align-items: flex-end; gap: 8px; }
.psd-phealth-tag { display: flex; align-items: center; gap: 8px; }
.psd-statline { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 28px; padding: 12px 16px; background: var(--card-background); border: 1px solid var(--separations-border); border-radius: 8px; }
.psd-statline > div { display: flex; flex-direction: column; }
.psd-statline b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.psd-statline span { font-size: 11px; color: var(--typography-light); }
.psd-statline > .psd-src { margin-left: auto; }
.psd-tbl { display: flex; flex-direction: column; gap: 6px; min-width: 0; width: 100%; }
.psd-tbl-foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--typography-light); padding: 0 2px; }

/* since-the-last-analysis (live delta) */
.psd-delta { background: var(--card-background); border: 1px solid var(--separations-border); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
.psd-delta-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.psd-delta-head .psd-src { margin-left: auto; }
.psd-delta-row { display: flex; flex-wrap: wrap; gap: 8px 32px; }
.psd-delta-item { display: flex; align-items: baseline; gap: 6px; }
.psd-delta-item b { font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.psd-delta-item span { font-size: 12px; color: var(--typography-muted); }
.psd-delta-item.tone-warn b { color: var(--orange-base); }
.psd-delta-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--typography-muted); }
.psd-delta-list li { display: grid; grid-template-columns: 10px minmax(0, 260px) 1fr auto; gap: 10px; align-items: center; }
.psd-diag { display: flex; flex-direction: column; gap: 8px; }
.psd-info-table.mono td { font-family: ui-monospace, Menlo, monospace; font-size: 10px; }
.psd-flow { display: flex; align-items: stretch; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
.psd-flow-node { flex: 1 0 170px; max-width: 240px; border: 1px solid var(--separations-base); border-radius: 8px; padding: 10px 12px; background: var(--card-background); display: flex; flex-direction: column; gap: 6px; }
.psd-flow-node.off { border-style: dashed; opacity: .75; }
.psd-flow-node.bad { border-color: var(--red-base); }
.psd-flow-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
.psd-flow-head code { font-size: 12px; color: var(--typography-base); word-break: break-word; }
.psd-flow-bar { display: flex; height: 10px; border-radius: 4px; background: var(--slate-hover); overflow: hidden; }
.psd-flow-bar span { display: block; height: 100%; }
.psd-flow-n { font-size: 12px; color: var(--typography-muted); font-variant-numeric: tabular-nums; }
.psd-flow-n b { font-size: 14px; font-weight: 500; color: var(--typography-base); }
.psd-flow-sub { font-size: 11px; color: var(--typography-light); }
.psd-flow-arrow { display: flex; align-items: center; color: var(--typography-light); flex: 0 0 auto; }
.psd-pipe-more { display: flex; justify-content: flex-end; margin-top: 8px; }
.psd-section-head { margin-top: 8px; }
.psd-flow-why { margin-top: auto; }
.psd-why { margin-top: 12px; border: 1px solid var(--separations-base); border-radius: 8px; padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.psd-why-head { display: flex; justify-content: space-between; align-items: center; }
.psd-why-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.psd-why-text { margin: 4px 0 8px; font-size: 13px; color: var(--typography-base); }
.psd-why-row { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; padding: 3px 0; border-bottom: 1px solid var(--separations-base); }
.psd-why-row span:first-child { color: var(--typography-muted); }
.psd-why-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

</style>

<script>/* src/logic.js */
/* Project Status — pure logic (no DOM, no Flywheel).
 *
 * Two halves, because a real project can hold ~165k sessions and ~5.9M jobs (GNE, 2026-11-20):
 *  1. buildFacts(rec, now)  — GEAR SIDE. Streams raw sessions / jobs / tasks once and emits a small,
 *     JSON-plain facts document (counts, rates, series, top-N rows + totals). The browser never sees raw records.
 *     In the prototype it runs in the browser on the small demo studies to stand in for the snapshot gear.
 *  2. assess(facts, opts, now) — APP SIDE. Turns facts into health calls and the attention list using
 *     the app's thresholds. Thresholds are rates and percentiles, so they hold at any project size.

(function () {
  'use strict';

  const dayStart = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };

  const DEFAULTS = {
    templateWatch: 0.95, templateAct: 0.85,      // share of sessions satisfying the session template
    staleUploadDays: 21,                          // an active site with no upload for this long
    overdueActShare: 0.10, overdueActMin: 5,      // overdue / open reads (and at least this many) → Action
    overdueWatchShare: 0.02,                      // overdue / open reads → Watch
    stalledWatchShare: 0.02,                      // stalled / open reads → Watch
    smallQueue: 50,                               // below this many open reads, any overdue/stalled read → Watch
    stalledAfterDays: 7,
    failWatch: 0.05, failAct: 0.15,               // failed / finished jobs in the window
    gearMinRuns: 10,                              // a gear needs this many finished runs before it is judged
    queueP95WatchMin: 60,                         // p95 wait of jobs pending now
    weeks: 12,
    windowDays: 7,
    downloadSpikeX: 3, downloadSpikeMin: 100, idleDays: 30, maxSessions: 3000, maxJobs: 30000,          // browser-compute guard (live harness, until the snapshot gear exists)
    siteField: 'info.site', visitField: 'info.visit',

  const SEV = { act: 3, watch: 2, ok: 1, info: 1, na: 0, off: 0 };
  const worstOf = a => a.reduce((x, y) => (SEV[y] > SEV[x] ? y : x), 'na');

  // ================================================================ 1. FACTS (gear side)
  function dataFacts(sessions, now, o) {
    const subjects = new Set(sessions.map(s => s.subject && (s.subject._id || s.subject.code)));
    const ok = sessions.filter(s => s.satisfies_template !== false).length;
    const last = sessions.reduce((m, s) => Math.max(m, ts(s.created) || 0), 0) || null;
    const recent = sessions.filter(s => ts(s.created) > now - o.windowDays * DAY).length;
    const bySite = new Map();
    for (const s of sessions) {
      const site = (s.info && s.info.site) || '—';
      const e = bySite.get(site) || { site, subjects: new Set(), sessions: 0, ok: 0, last: 0 };
      e.subjects.add(s.subject && s.subject.code); e.sessions++; if (s.satisfies_template !== false) e.ok++;

    for (const s of sessions) { const w = weekStart(ts(s.created)); if (weeks.has(w)) weeks.set(w, weeks.get(w) + 1); }

      id: s._id, subject: s.subject && s.subject.code, visit: (s.info && s.info.visit) || s.label, site: s.info && s.info.site,
      created: ts(s.created), missing: (s.info && s.info._missing && s.info._missing.join(', ')) || 'Session template not satisfied',
    })).sort((a, b) => b.created - a.created);
    return { subjects: subjects.size, sessions: sessions.length, template_ok: ok, last, recent,
      sites, sites_total: sites.length, missing: top(missing), missing_total: missing.length,
      weekly: [...weeks].map(([week, n]) => ({ week, n })) };
  }

  // Access log (Admin › Access Log; GET /api/report/accesslog). Rows are aggregated (count + first/last access), so
  // events are dated by last_access (approximate). Subject fields are dropped before this point; only counts leave.
  const CHANGE_TYPES = ['delete_file', 'delete_container', 'delete_analysis', 'delete_annotation', 'delete_form_response', 'replace_file',
    'file_moved_away', 'file_moved_in', 'container_moved_away', 'container_moved_in', 'sync_to_external'];
  const ACCESS_TYPES = ['add_permission', 'modify_permission', 'role_change', 'user_role_change'];
  function activityFacts(rows, now, o) {
    if (rows == null) return { available: false };
    const human = rows.filter(r => r.origin && r.origin.type === 'user' && r.access_type !== 'user_login' && r.access_type !== 'user_logout');
    const la = r => ts(r.last_access);
    const users = days => new Set(human.filter(r => now - la(r) <= days * DAY).map(r => r.origin.id)).size;
    const last = human.reduce((m, r) => Math.max(m, la(r) || 0), 0) || null;
    const dl = rows.filter(r => r.access_type === 'download_file');
    const weeks = new Map(weekKeys(now, o.weeks, true).map(w => [w, 0]));
    for (const r of dl) { const w = weekStart(la(r)); if (weeks.has(w)) weeks.set(w, weeks.get(w) + (r.count || 1)); }
    const sum = (arr, days) => arr.filter(r => now - la(r) <= days * DAY).reduce((n, r) => n + (r.count || 1), 0);
    const byUser = new Map();
    for (const r of dl.filter(r => now - la(r) <= 30 * DAY)) { const u = r.origin && r.origin.id || '—'; const e = byUser.get(u) || { user: u, n: 0, last: 0 }; e.n += r.count || 1; e.last = Math.max(e.last, la(r)); byUser.set(u, e); }
    const evt = types => { const m = new Map(); for (const r of rows.filter(r => types.includes(r.access_type) && now - la(r) <= 30 * DAY)) {
      const k = `${r.access_type}|${r.origin && r.origin.id}`; const e = m.get(k) || { type: r.access_type, user: r.origin && r.origin.id || '—', n: 0, last: 0 }; e.n += r.count || 1; e.last = Math.max(e.last, la(r)); m.set(k, e); }
      return [...m.values()].sort((a, b) => b.last - a.last); };
    const changes = evt(CHANGE_TYPES), access = evt(ACCESS_TYPES);
    const weekly = [...weeks].map(([week, n]) => ({ week, n }));
    const prior = weekly.slice(0, -1).slice(-4).map(w => w.n).sort((a, b) => a - b);
    return { available: true, last, users_7d: users(7), users_30d: users(30), downloads_7d: sum(dl, 7), downloads_30d: sum(dl, 30),
      downloads_baseline: prior.length ? (prior[(prior.length - 1) >> 1] + prior[prior.length >> 1]) / 2 : 0,
      downloads_weekly: weekly, top_downloaders: top([...byUser.values()].sort((a, b) => b.n - a.n)), downloaders_total: byUser.size,
      changes: top(changes), changes_total: changes.reduce((n, e) => n + e.n, 0), changes_7d: sum(rows.filter(r => CHANGE_TYPES.includes(r.access_type)), 7),
      access_changes: top(access), access_changes_7d: sum(rows.filter(r => ACCESS_TYPES.includes(r.access_type)), 7) };
  }

  function taskFacts(tasks, now, o, readsPerSession) {
    if (!tasks.length && !readsPerSession) return { used: false };
    const primary = tasks.filter(t => t.subcategory !== 'adjudicator' && t.status !== 'cancelled');
    const adj = tasks.filter(t => t.subcategory === 'adjudicator' && t.status !== 'cancelled' && t.status !== 'completed');
    const enrich = t => {
      const due = dueTs(t.due_date);
      const idle = (now - (ts(t.modified) || ts(t.created))) / DAY;

        stalled: t.status === 'in_progress' && idle > o.stalledAfterDays, ageDays: (now - ts(t.created)) / DAY,
        reader: t.assignee ? (t.assignee.type === 'user' ? t.assignee.id.split('@')[0] : 'Pool') : 'Unassigned', assigned: !!t.assignee,

      const e = byReader.get(t.reader) || { reader: t.reader, total: 0, completed: 0, open: 0, overdue: 0, stalled: 0, turn: [] };

      readers: top(readers, 200), readers_total: readers.length,
      weekly: [...weeks].map(([week, n]) => ({ week, n })),
      age: buckets.map(([a, b, label]) => ({ bucket: label, n: open.filter(t => t.ageDays >= a && t.ageDays < b).length })),

  function computeFacts(jobs, rules, now, o) {
    const since = now - o.windowDays * DAY;

    const win = jobs.filter(j => ts(j.created) > since);
    const finished = win.filter(j => j.state === 'complete' || j.state === 'failed');
    const failed = win.filter(j => j.state === 'failed');
    const pending = jobs.filter(j => j.state === 'pending').map(j => ({ id: j.id, gear: j.gear_info.name, version: j.gear_info.version,
      launched_by: j.origin.type === 'rule' ? 'Gear rule' : j.origin.id, wait_min: (now - ts(j.created)) / MIN })).sort((a, b) => b.wait_min - a.wait_min);
    const waits = win.filter(j => j.transitions && j.transitions.running).map(j => (ts(j.transitions.running) - ts(j.created)) / MIN);
    const byGear = new Map();

      if (ts(j.created) >= e.last) { e.last = ts(j.created); e.lastVersion = j.gear_info.version; }

        reasons: [...e.reasons].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([reason, n]) => ({ reason, n })),

    const days = new Map();
    for (let i = 13; i >= 0; i--) { const d = dayStart(now - i * DAY); days.set(d, { day: d, complete: 0, failed: 0 }); } // DST-safe keys
    for (const j of jobs) { if (j.state !== 'complete' && j.state !== 'failed') continue; const d = dayStart(finishedAt(j) || ts(j.created)); const e = days.get(d); if (e) e[j.state]++; }
    const latest = new Map();
    for (const j of jobs) { const k = `${j.parents.session}|${j.gear_info.name}`; const p = latest.get(k); if (!p || ts(j.created) > ts(p.created)) latest.set(k, j); }
    const unresolved = [...latest.values()].filter(j => j.state === 'failed')
      .map(j => ({ id: j.id, gear: j.gear_info.name, version: j.gear_info.version, reason: j.failure_reason || null,
        launched_by: j.origin.type === 'rule' ? 'Gear rule' : j.origin.id, at: finishedAt(j) || ts(j.created) }))
      .sort((a, b) => b.at - a.at);

      running: jobs.filter(j => j.state === 'running').length,
      pending: top(pending), pending_total: pending.length,
      queue_p95_min: quantile(pending.map(p => p.wait_min), 0.95), queue_max_min: pending.length ? pending[0].wait_min : null,
      median_wait_min: median(waits),

      gears, daily: [...days.values()], unresolved: top(unresolved), unresolved_total: unresolved.length,
      rules: rules.map(r => ({ name: r.name, gear: r._gear || r.name, disabled: !!r.disabled })) };
  }

  function pipelineFacts(sessions, jobs, tasks, gearsExpected, readsPerSession, rules, files) {
    const latest = new Map();
    for (const j of jobs) { const k = `${j.parents.session}|${j.gear_info.name}`; const p = latest.get(k); if (!p || ts(j.created) > ts(p.created)) latest.set(k, j); }
    const readsBySession = new Map();
    for (const t of tasks) { if (t.subcategory === 'adjudicator' || t.status === 'cancelled') continue; const s = t.parents && t.parents.session; const e = readsBySession.get(s) || { n: 0, done: 0 }; e.n++; if (t.status === 'completed') e.done++; readsBySession.set(s, e); }
    // A rule gear with no job anywhere in the project would zero the step; report it instead (r6nvg8 finding, 2026-11-23).
    const ran = new Set(jobs.map(j => j.gear_info.name));
    const never = gearsExpected.filter(g => !ran.has(g));
    gearsExpected = gearsExpected.filter(g => ran.has(g));
    const coverage = gearsExpected.map(g => ({ gear: g, complete: sessions.filter(s => { const j = latest.get(`${s._id}|${g}`); return j && j.state === 'complete'; }).length }));
    const st = { uploaded: sessions.length, template: 0, processed: 0, tasked: 0, read: 0, never_ran: never, coverage, flow: ruleFlow(sessions, jobs, latest, rules || [], files) };

      if (s.satisfies_template === false) continue; st.template++;
      if (!gearsExpected.every(g => { const j = latest.get(`${s._id}|${g}`); return j && j.state === 'complete'; })) continue; st.processed++;
      if (!readsPerSession) continue;
      const r = readsBySession.get(s._id); if (!r) continue; st.tasked++;
      if (r.done >= Math.max(readsPerSession, r.n)) st.read++;

  }

  // ---- "Why?" for a rule gear: does anything match, and when did it arrive relative to the rule's last change?
  const COND_LABEL = { 'file.type': 'file type', 'file.name': 'file name', 'file.modality': 'modality', 'file.classification': 'classification', 'file.tags': 'file tags',
    'container.has-type': 'container has a file of type', 'container.has-classification': 'container has classification', 'container.has-measurement': 'container has measurement' };
  function condText(c) { return `${COND_LABEL[c.type] || c.type} ${c.regex ? 'matches' : 'is'} ${c.regex ? '/' + c.value + '/' : '"' + c.value + '"'}`; }
  function ruleText(r) {
    const parts = [];
    const strip = arr => (arr || []).filter(c => c.type !== 'file.parent_ref.type');
    const where = [...(r.all || []), ...(r.any || [])].find(c => c.type === 'file.parent_ref.type');
    r = { ...r, all: strip(r.all), any: strip(r.any), not: strip(r.not) };
    if (r.all && r.all.length) parts.push(r.all.map(condText).join(' and '));
    if (r.any && r.any.length) parts.push('any of: ' + r.any.map(condText).join('; '));
    let t = parts.length ? `Runs on files where ${parts.join(', and ')}` : 'Runs on every file (no conditions)';
    if (r.not && r.not.length) t += `, except ${r.not.map(condText).join(' or ')}`;
    if (where) { const types = String(where.value).split(',').map(x => x.trim()).filter(Boolean); t += types.length >= 5 ? ', on any container' : `, on ${types.join(', ')} files`; }

  }
  function condMatch(c, f) {

      return vals.some(x => (c.regex ? (() => { try { return new RegExp(c.value).test(String(x)); } catch (e) { return false; } })() : String(x).toLowerCase() === String(c.value).toLowerCase())); };

      case 'file.type': return test(f.type);
      case 'file.name': return test(f.name);
      case 'file.modality': return test(f.modality);
      case 'file.classification': return test(f.classification);
      case 'file.tags': return test(f.tags);
      // The rule's "If the file from" container choice, stored as a comma list of container types.
      case 'file.parent_ref.type': return String(c.value).split(',').map(x => x.trim().toLowerCase()).includes(String(f.parent_type || 'acquisition').toLowerCase());

    }
  }
  function ruleMatches(r, f) {
    const ev = arr => (arr || []).map(c => condMatch(c, f));
    const all = ev(r.all), any = ev(r.any), not = ev(r.not);
    if ([...all, ...any, ...not].some(v => v === null)) return null;
    return all.every(Boolean) && (!any.length || any.some(Boolean)) && !not.some(Boolean);
  }
  function diagnoseRule(e, c, files, sessions, latest) {
    const r = e.ruleObjs.find(x => !x.disabled) || e.ruleObjs[0];
    const out = { rule: r.name, text: ruleText(r), version: e.version || null, auto_update: !!r.auto_update,
      changed: ts(r.modified) || ts(r.created) || null, changed_by: r.last_modified_by || null, files_known: Array.isArray(files) };
    const behind = c.failed + c.running + c.none;
    if (!Array.isArray(files)) { out.verdict = behind ? 'File details were not loaded, so the rule could not be checked against the files.' : null; return out; }
    const judged = files.map(f => ({ f, m: ruleMatches(r, f) }));
    const unknown = judged.some(x => x.m === null);
    const matching = judged.filter(x => x.m).map(x => x.f);
    const ids = new Set(sessions.map(s => s._id));
    const cut = out.changed;
    const before = cut ? matching.filter(f => ts(f.created) && ts(f.created) < cut).length : null;
    const noJob = new Map();
    for (const f of matching) if (f.session && ids.has(f.session) && !latest.get(`${f.session}|${e.gear}`)) { const x = noJob.get(f.session) || { session: f.session, files: 0, before: 0 }; x.files++; if (cut && ts(f.created) < cut) x.before++; noJob.set(f.session, x); }
    const nj = [...noJob.values()];
    const sessMatch = new Set(matching.map(f => f.session).filter(Boolean)).size;
    Object.assign(out, { files: files.length, matching: matching.length, matching_sessions: sessMatch, before, after: before == null ? null : matching.length - before,
      no_job_sessions: nj.length, no_job_before: nj.filter(x => x.before === x.files).length, no_job: nj.slice(0, 50).map(x => { const ss = sessions.find(y => y._id === x.session) || {}; return { id: x.session, subject: ss.subject && ss.subject.code, visit: (ss.info && ss.info.visit) || ss.label }; }), unknown_conditions: unknown });
    const date = cut ? new Date(cut).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : null;
    if (!behind) out.verdict = null;
    else if (unknown && !matching.length) out.verdict = 'This rule uses container-level conditions the app cannot check yet; compare them with the files by hand.';
    else if (!matching.length) out.verdict = `No acquisition files in this project match the rule's conditions (${files.length} files checked). Check the conditions against the files' type and name.`;
    else if (nj.length && out.no_job_before >= nj.length * 0.8 && cut) out.verdict = `${out.no_job_before} of ${nj.length} sessions without a job only have matching files added before the rule was last changed (${date}). Rules run on new or changed files, not on files already there, so these were never processed. Run the gear on them as a batch.${nj.length - out.no_job_before ? ` The other ${nj.length - out.no_job_before} got matching files after the change and still have no job: check the Jobs Log for them (files copied or moved in may not trigger rules).` : ''}`;
    else if (nj.length) out.verdict = `${nj.length} sessions have matching files but no job, including files added after the rule changed${date ? ` (${date})` : ''}. Check the gear's permissions and the Jobs Log for this gear.`;
    else if (c.failed) out.verdict = `Every session with matching files has a job, but the latest run failed on ${c.failed} ${c.failed === 1 ? 'session' : 'sessions'}. Open the failed jobs' logs.`;
    else if (c.running) out.verdict = `${c.running} jobs are still running or queued.`;
    else out.verdict = `${c.none} sessions have no matching files, so the rule has nothing to run on there.`;
    return out;
  }

  /** Rule flow: one node per rule gear, where each session's latest job of that gear stands.
   *  Order is inferred, not declared: median minutes from a session's first job to this gear's first job (approximate). */
  function ruleFlow(sessions, jobs, latest, rules, files) {
    const byGear = new Map();
    for (const r of rules) { const g = r._gear || r.name; const e = byGear.get(g) || { gear: g, rules: [], ruleObjs: [], disabled: true, missing: !!r._gearMissing, label: r._gearMissing ? r.name : g, version: r.gear_version }; e.rules.push(r.name); e.ruleObjs.push(r); if (!r.disabled) e.disabled = false; byGear.set(g, e); }
    // Order: per session, rank gears by when their latest job was created; a node's order = median rank (approximate run order).
    const ranks = new Map();
    const perSession = new Map();
    for (const [k, j] of latest) { const [sid, g] = k.split('|'); if (!byGear.has(g)) continue; (perSession.get(sid) || perSession.set(sid, []).get(sid)).push([ts(j.created), g]); }
    for (const arr of perSession.values()) { arr.sort((a, b) => a[0] - b[0]); arr.forEach(([, g], i) => (ranks.get(g) || ranks.set(g, []).get(g)).push(i)); }
    const ids = new Set(sessions.map(x => x._id));
    return [...byGear.values()].map(e => {
      const c = { complete: 0, failed: 0, running: 0, none: 0 };
      for (const sid of ids) { const j = latest.get(`${sid}|${e.gear}`);
        if (!j) { c.none++; continue; }
        if (j.state === 'complete') c.complete++; else if (j.state === 'failed' || j.state === 'cancelled') c.failed++; else c.running++; }
      const offs = (ranks.get(e.gear) || []).slice().sort((a, b) => a - b);
      const ran = c.complete + c.failed + c.running;
      return { gear: e.gear, rules: e.rules, disabled: e.disabled, sessions: ids.size, ...c, order: offs.length ? offs[offs.length >> 1] : null, label: e.label || e.gear, missing_gear: !!e.missing, state: e.disabled ? 'disabled' : ran ? 'enabled' : 'never_ran', version: e.version || null,
        why: e.disabled ? null : diagnoseRule(e, c, files, sessions, latest) };
    }).sort((a, b) => (a.state === 'disabled') - (b.state === 'disabled') || (a.order == null) - (b.order == null) || (a.order || 0) - (b.order || 0) || a.gear.localeCompare(b.gear));
  }

  /** GEAR SIDE: raw records → facts document (what project-status.summary.json would hold). */
  function buildFacts(rec, now, opts) {
    const o = { ...DEFAULTS, ...(opts || {}) };
    const gearsExpected = rec.rules.filter(r => !r.disabled).map(r => r._gear || r.name);
    const tasks = taskFacts(rec.tasks, now, o, rec.spec.readsPerSession);
    return {
      schema: 'project-status/facts@1', generated_at: now, window_days: o.windowDays,
      project: { _id: rec.project._id, label: rec.project.label, info: rec.project.info },
      statistics: rec.statistics, // from GET /api/projects/{id} → statistics (verified on r6nvg8, 2026-11-20)
      data: dataFacts(rec.sessions, now, o), activity: rec.access === undefined ? undefined : activityFacts(rec.access, now, o), tasks, compute: computeFacts(rec.jobs, rec.rules, now, o),
      pipeline: { ...pipelineFacts(rec.sessions, rec.jobs, rec.tasks, gearsExpected, rec.spec.readsPerSession, rec.rules, rec.files), reads: !!tasks.used },
    };
  }

  // ================================================================ 2. ASSESS (app side)
  function assess(f, opts, now) {
    const o = { ...DEFAULTS, ...(opts || {}) };
    if (f.stub) return { stub: true, health: 'na', data: { health: 'na', share: null, sites: [], stale: [] }, tasks: { health: 'na', share: null },
      compute: { health: 'na', rate: null, gears: [], disabled: [], queueSlow: false }, steps: [], attention: [], options: o };
    const pct = v => `${(Math.round(v * 1000) / 10).toLocaleString(undefined, { maximumFractionDigits: 1 })}%`;
    const plural = (n, w) => `${n.toLocaleString()} ${w}${n === 1 ? '' : 's'}`;
    const d = f.data, t = f.tasks, c = f.compute;

    // data
    const share = d.sessions ? d.template_ok / d.sessions : null;
    const sites = d.sites.map(s => {
      const sh = s.sessions ? s.template_ok / s.sessions : null, idle = (now - s.last) / DAY;
      return { ...s, id: s.site, share: sh, idle_days: idle,
        health: sh != null && sh < o.templateAct ? 'act' : (sh != null && sh < o.templateWatch) || idle > o.staleUploadDays ? 'watch' : 'ok' };
    });
    const stale = sites.filter(s => s.idle_days > o.staleUploadDays && s.sessions > 0).sort((a, b) => b.idle_days - a.idle_days);
    const dataH = !d.sessions ? 'watch' : share < o.templateAct ? 'act' : share < o.templateWatch || stale.length ? 'watch' : 'ok';

    // tasks
    let tasksH = 'na', tShare = null;
    if (t.used) {
      tShare = t.total ? t.completed / t.total : null;
      const od = t.open ? t.overdue_total / t.open : 0, stl = t.open ? t.stalled_total / t.open : 0;
      const small = t.open < o.smallQueue;
      tasksH = !t.total ? 'watch'
        : t.overdue_total >= o.overdueActMin && od >= o.overdueActShare ? 'act'
        : od >= o.overdueWatchShare || stl >= o.stalledWatchShare || (small && (t.overdue_total || t.stalled_total)) ? 'watch' : 'ok';
    }

    // compute
    const rate = c.finished ? c.failed / c.finished : null;
    const gears = c.gears.map(g => {
      const r = g.finished ? g.failed / g.finished : null;
      const judged = r != null && g.finished >= o.gearMinRuns;
      return { ...g, id: g.gear, rate: r,
        version_text: g.versions.length > 1 ? g.versions.map(v => `${v.version} (${v.runs.toLocaleString()})`).join(' · ') : (g.versions[0] && g.versions[0].version) || g.last_version || '—',
        top_reason: g.reasons.length ? `${g.reasons[0].reason} (${g.reasons[0].n.toLocaleString()})` : '—',
        health: judged && r >= o.failAct ? 'act' : judged && g.failed >= 2 && r >= o.failWatch ? 'watch' : g.rule === 'disabled' ? 'watch' : 'ok' };
    }).sort((a, b) => SEV[b.health] - SEV[a.health] || (b.rate || 0) - (a.rate || 0));
    const disabled = c.rules.filter(r => r.disabled);
    const queueSlow = c.queue_p95_min != null && c.queue_p95_min > o.queueP95WatchMin;
    const gearH = worstOf(gears.map(g => g.health));
    const computeH = (rate != null && rate >= o.failAct) || gearH === 'act' ? 'act'
      : (rate != null && rate >= o.failWatch) || gearH === 'watch' || queueSlow || disabled.length ? 'watch' : 'ok';

    // pipeline
    const p = f.pipeline;
    const steps = [
      { key: 'uploaded', label: 'Uploaded', n: p.uploaded, owner: 'data' },
      { key: 'template', label: 'Template complete', n: p.template, owner: 'data' },
      { key: 'processed', label: 'Pipeline complete', n: p.processed, owner: 'compute' },
    ];
    if (p.reads) steps.push({ key: 'tasked', label: 'Tasked for read', n: p.tasked, owner: 'tasks' }, { key: 'read', label: 'Reads complete', n: p.read, owner: 'tasks' });

    // attention
    const a = [];
    const add = (lens, sev, title, detail, go) => a.push({ id: `${lens}-${a.length}`, lens, sev, title, detail, go });
    if (d.missing_total) add('data', share < o.templateAct ? 'act' : share < o.templateWatch ? 'watch' : 'info',
      `${plural(d.missing_total, 'session')} missing required data`, `${pct(share)} of sessions satisfy the session template (target ≥ ${pct(o.templateWatch)}).`, 'data');
    stale.slice(0, 5).forEach(s => add('data', 'watch', `No uploads from site ${s.site} in ${Math.floor(s.idle_days)} days`, `Last upload ${new Date(s.last).toLocaleDateString()}; ${plural(s.subjects, 'subject')}.`, 'data'));
    const act = f.activity;
    if (act && act.available) {
      const spike = act.downloads_7d >= o.downloadSpikeMin && act.downloads_7d > o.downloadSpikeX * Math.max(1, act.downloads_baseline);
      if (spike) add('data', 'watch', `Downloads up: ${act.downloads_7d.toLocaleString()} in the last 7 days`, `Usual week about ${Math.round(act.downloads_baseline).toLocaleString()}. Top downloader: ${act.top_downloaders[0] ? act.top_downloaders[0].user : '—'}.`, 'data');
      if (act.changes_7d) add('data', 'info', `${plural(act.changes_7d, 'data change')} in the last 7 days`, 'Deletes, replacements, moves or external syncs (Access Log). See Data › Activity.', 'data');
      if (act.access_changes_7d) add('data', 'info', `${plural(act.access_changes_7d, 'permission change')} in the last 7 days`, 'Permission or role changes on this project (Access Log).', 'data');
      if (!act.last || now - act.last > o.idleDays * DAY) add('data', 'info', act.last ? `No user activity in ${Math.floor((now - act.last) / DAY)} days` : 'No user activity recorded', 'Nobody has viewed, downloaded or changed data here recently.', 'data');
    }
    if (stale.length > 5) add('data', 'watch', `${stale.length - 5} more sites silent for ${o.staleUploadDays}+ days`, 'See the Sites table on the Data tab.', 'data');
    if (t.used) {
      if (t.overdue_total) add('tasks', tasksH === 'act' ? 'act' : 'watch', `${plural(t.overdue_total, 'read')} overdue`,
        `${pct(t.overdue_total / Math.max(1, t.open))} of open reads. Oldest ${t.overdue[0].overdueDays} days past due (${t.overdue[0].reader}).`, 'tasks');
      if (t.stalled_total) add('tasks', 'watch', `${plural(t.stalled_total, 'read')} stalled`, `In progress with no activity for more than ${o.stalledAfterDays} days.`, 'tasks');
      if (t.adj_blocked) add('tasks', 'info', `${plural(t.adj_blocked, 'adjudication')} waiting on comparison`, 'Created up front as blocked; opens when both primary reads finish.', 'tasks');
      const gap = p.processed - p.tasked;
      if (gap > 0) add('tasks', gap > Math.max(10, p.processed * 0.05) ? 'watch' : 'info', `${plural(gap, 'processed session')} not yet tasked for read`, 'Pipeline complete, no reader task created.', 'tasks');
    }
    gears.filter(g => (g.health === 'act' || g.health === 'watch') && g.rate != null && g.finished >= o.gearMinRuns)
      .forEach(g => add('compute', g.health, `${g.gear} failing ${pct(g.rate)} (last ${f.window_days} d)`, `${g.failed.toLocaleString()} of ${g.finished.toLocaleString()} runs · top cause: ${g.top_reason}.`, 'compute'));
    disabled.forEach(r => add('compute', 'watch', `Gear rule "${r.name}" is disabled`, 'New sessions are not being processed by this gear.', 'compute'));
    if (queueSlow) add('compute', 'watch', `Queue p95 wait ${Math.round(c.queue_p95_min)} min`, `${plural(c.pending_total, 'job')} pending; longest ${Math.round(c.queue_max_min)} min.`, 'compute');
    (p.never_ran || []).forEach(g => add('compute', 'watch', `Rule gear ${g} has never run here`, 'Its rule is enabled but no job exists in this project; left out of Pipeline complete.', 'compute'));
    (p.coverage || []).filter(c2 => c2.complete < p.template).sort((x, y) => x.complete - y.complete).slice(0, 3)
      .forEach(c2 => add('compute', 'info', `${c2.gear} complete on ${c2.complete} of ${p.template} sessions`, 'Latest run per session; sessions missing it hold back Pipeline complete.', 'compute'));
    if (c.unresolved_total) add('compute', 'info', `${plural(c.unresolved_total, 'failed job')} not yet re-run`, 'Latest run of that gear on the session failed.', 'compute');
    a.sort((x, y) => SEV[y.sev] - SEV[x.sev]);

    const un = f.unavailable || {};
    const dH = un.data ? 'off' : dataH, cH = un.compute ? 'off' : computeH;
    const stepsShown = un.compute ? steps.slice(0, 2) : steps;
    const att = a.filter(x => !(un.compute && x.lens === 'compute') && !(un.data && x.lens === 'data'));
    return { health: worstOf([dH, tasksH, cH]), unavailable: un, data: { health: dH, share, sites, stale },
      tasks: { health: tasksH, share: tShare }, compute: { health: cH, rate, gears, disabled, queueSlow }, steps: stepsShown, attention: att, options: o };
  }

  window.PSD = { buildFacts, assess, DEFAULTS, SEV, worstOf, natural, quantile, TOP_N };
})();
</script>
<script>/* src/live.js */
/* Project Status — live adapter for the extension-app harness.
 * Reads Flywheel through the Extension SDK (ReadOnly scope, GET only) and builds the same facts document
 * the snapshot gear will write. Until that gear exists, facts are computed in the browser, and only for
 * projects small enough to page through safely (size guard from project.statistics). Bigger projects show
 * live totals only, marked "Needs snapshot gear". Every call is logged for the Diagnostics view. */
(function () {
  'use strict';
  const TASK_COLUMNS = 'task_id,created,modified,status,priority,protocol_label,protocol_id,assignee,parents,due_date,subcategory,read_number,transitions,parent_ref.type,parent_ref.id';
  const PAGE = 100, JOB_PAGE = 500;
  const rows = res => (Array.isArray(res) ? res : (res && res.results) || []);
  const totalOf = res => (res && !Array.isArray(res) && res.total != null ? res.total : null);
  const pick = (o, path) => String(path || '').split('.').reduce((v, k) => (v == null ? v : v[k]), o);

  function makeApi(ext, log) {
    return async function api(path, params) {
      const t0 = performance.now();
      const entry = { at: Date.now(), method: 'GET', path, params: params || null };
      try {
        const res = await Promise.race([
          ext.apiRequest('GET', path, params || undefined),
          new Promise((_, rej) => setTimeout(() => rej(new Error('Timed out after 30 s')), 30000)),
        ]);
        entry.ok = true; entry.ms = Math.round(performance.now() - t0);
        entry.rows = Array.isArray(res) ? res.length : res && Array.isArray(res.results) ? res.results.length : null;
        entry.total = totalOf(res);
        const first = Array.isArray(res) ? res[0] : res && res.results ? res.results[0] : res;
        // Access log rows carry subject labels: keep field names only, never values.
        if (!log.sample[path.replace(/[0-9a-f]{24}/g, '{id}')]) log.sample[path.replace(/[0-9a-f]{24}/g, '{id}')] = /accesslog/.test(path) && first && typeof first === 'object' ? Object.fromEntries(Object.keys(first).map(k => [k, typeof first[k] === 'object' && first[k] ? Object.fromEntries(Object.keys(first[k]).map(k2 => [k2, ''])) : ''])) : first;
        log(entry);
        return res;
      } catch (e) {
        entry.ok = false; entry.ms = Math.round(performance.now() - t0);
        entry.error = (e && (e.message || e.statusText)) || String(e);
        entry.status = (e && (e.status || e.statusCode)) || null;
        log(entry);
        throw e;
      }
    };
  }

  async function loadTasks(api, pid, note) {
    const seen = new Map();
    let filter = `parents.project=${pid}`, skip = 0, total = null, pages = 0;
    for (;;) {
      const params = { limit: PAGE, skip, sort: 'created:desc,task_id:asc', columns: TASK_COLUMNS };
      if (filter) params.filter = filter;
      let res;
      try { res = await api('/api/tasks/reader', params); }
      catch (e) {
        if (filter && skip === 0) { note('Reader tasks: project filter rejected; loading all visible tasks and filtering here.'); filter = null; continue; }
        throw e;
      }
      const batch = rows(res);
      if (totalOf(res) != null) total = totalOf(res);
      for (const t of batch) seen.set(t._id ?? t.id, t);
      skip += batch.length; pages++;
      if (!batch.length || batch.length < PAGE || (total != null && skip >= total) || pages > 100) break;
    }
    return [...seen.values()].filter(t => !t.parents || !t.parents.project || t.parents.project === pid);
  }

  async function loadJobs(api, pid, note, maxJobs) {
    const seen = new Map();
    let page = 1, total = null;
    for (;;) {
      const res = await api('/api/jobs', { filter: `parents.project=${pid}`, limit: JOB_PAGE, page, sort: 'created:desc', include_parent_info: true });
      const batch = rows(res);
      if (totalOf(res) != null) total = totalOf(res);
      for (const j of batch) seen.set(j.id || j._id, j);
      if (!batch.length || batch.length < JOB_PAGE || (total != null && seen.size >= total) || seen.size >= maxJobs) break;
      page++;
    }
    const all = [...seen.values()];
    const mine = all.filter(j => !j.parents || !j.parents.project || j.parents.project === pid);
    if (mine.length < all.length) note(`Jobs: ${all.length - mine.length} jobs from other projects came back and were dropped (filter ignored?).`);
    if (total != null && total > mine.length) note(`Jobs: loaded ${mine.length} of ${total}; facts cover the newest ${mine.length}.`);
    return mine;
  }

  // Map raw Flywheel records onto the shapes buildFacts() expects.
  function normSession(s, o) {
    const subj = s.subject || {};
    return { _id: s._id || s.id, label: s.label,
      subject: { _id: subj._id || subj.id || s.subject_id || null, code: subj.code || subj.label || subj._id || '—' },
      created: s.created, timestamp: s.timestamp,
      satisfies_template: s.satisfies_template, // undefined when the server does not send it → counted as satisfied; flagged in notes
      info: { site: pick(s, o.siteField) || pick(s, 'info.site') || '—', visit: pick(s, o.visitField) || s.label } };
  }
  function normJob(j, gearsById, acqToSession) {
    const gi = j.gear_info || {};
    const g = gi.name ? gi : gearsById.get(j.gear_id) || {};
    const pr = j.profile || {};
    // The job list has no parents/transitions/profile (r6nvg8, 2026-11-23). Parent ids come from include_parent_info
    // (shape unverified: accept {session:{_id}} or {session:'id'}) or from destination when it is a session.
    const pi = j.parent_info || {};
    const idOf = v => (v && typeof v === 'object' ? v._id || v.id : v) || null;
    const dest = j.destination || {};
    const acq = idOf(pi.acquisition) || (dest.type === 'acquisition' ? dest.id : null);
    const parents = j.parents || { project: idOf(pi.project), subject: idOf(pi.subject),
      session: idOf(pi.session) || (dest.type === 'session' ? dest.id : null) || (acq && acqToSession.get(acq)) || null, acquisition: acq };
    // No transitions on the list (r6nvg8, 2026-11-23): use modified as the finish time for finished jobs.
    const tr = { ...(j.transitions || {}) };
    if ((j.state === 'complete' || j.state === 'failed' || j.state === 'cancelled') && !tr[j.state]) tr[j.state] = j.modified;
    return { id: j.id || j._id, gear_info: { name: g.name || gi.name || j.gear_id || 'unknown', version: g.version || gi.version || '' },
      state: j.state, created: j.created, transitions: tr,
      profile: { elapsed_time_ms: pr.elapsed_time_ms || pr.total_time_ms || null },
      failure_reason: j.failure_reason || (j.state === 'failed' ? null : undefined),
      origin: j.origin || { type: 'unknown', id: null }, parents };
  }

  /** Load one project's raw records and build its facts. Returns { facts } or { tooBig } with the reason. */
  async function loadProject(api, project, ctx) {
    if (ctx.accessReady) await ctx.accessReady;
    const o = ctx.options, notes = [];
    const note = m => notes.push(m);
    const pid = project._id;
    const stats = project.statistics || {};
    if ((stats.sessions || 0) > o.maxSessions || (stats.jobs || 0) > o.maxJobs) {
      return { tooBig: `${(stats.sessions || 0).toLocaleString()} sessions / ${(stats.jobs || 0).toLocaleString()} jobs is above the browser limit (${o.maxSessions.toLocaleString()} / ${o.maxJobs.toLocaleString()}). Needs the snapshot gear.`, notes };
    }
    const [sessionsRes, jobsRes, rulesRes, tasksRes, acqRes] = await Promise.allSettled([
      api(`/api/projects/${pid}/sessions`),
      loadJobs(api, pid, note, o.maxJobs),
      api(`/api/projects/${pid}/rules`),
      loadTasks(api, pid, note),
      // /api/acquisitions?filter=parents.project= returns 500 on r6nvg8 (2026-11-23): retry the project route once instead.
      api(`/api/projects/${pid}/acquisitions`).catch(() => new Promise(res => setTimeout(res, 800)).then(() => api(`/api/projects/${pid}/acquisitions`))),
    ]);
    const unavailable = {};

      if (!ctx.gearFetch.has(id)) ctx.gearFetch.set(id, api(`/api/gears/${id}`).then(g => { if (g) ctx.gearsById.set(id, { name: (g.gear && g.gear.name) || g.name, version: (g.gear && g.gear.version) || g.version }); }).catch(() => null));

        auto_update: !!r.auto_update, any: cond(r.any), all: cond(r.all), not: cond(r.not), created: r.created, modified: r.modified, last_modified_by: (r.last_modified_by && (typeof r.last_modified_by === 'object' ? (r.last_modified_by.id || r.last_modified_by._id || [r.last_modified_by.firstname, r.last_modified_by.lastname].filter(Boolean).join(' ') || null) : r.last_modified_by)) || null,

  /** Load every project the user can see; facts for the small ones, live totals for the rest. */
  async function loadSite(ext, ctx, log, onProgress, opts) {
    opts = opts || {};

    let gears = [];
    try { gears = rows(await api('/api/gears')); } catch (e) { siteNotes.push(`Gears list: ${e.message || e}; gear names fall back to ids.`); }
    ctx.gearsById = new Map(gears.map(g => [g._id || g.id, { name: (g.gear && g.gear.name) || g.name, version: (g.gear && g.gear.version) || g.version }]));

    const withStats = p => ({ ...p, statistics: p.statistics || p.stats || (p.session_count != null ? { subjects: p.subject_count, sessions: p.session_count, acquisitions: null, acquisition_files: null, analyses: null, jobs: null } : undefined) });
    const projects = await Promise.all(list.map(async p => {
      if (p.statistics || p.stats) return withStats(p);

      if (p.session_count != null && p.info !== undefined) return withStats(p);

    const workers = Array.from({ length: Math.min(3, queue.length) }, async () => {
      while (queue.length) {
        const p = queue.shift();

        } catch (e) { out.push({ project: p, error: e.message || String(e) }); }

      }

  }

  /** Cheap live refresh for the open project: statistics only (one call). */
  async function refreshStats(api, pid) {
    const p = await api(`/api/projects/${pid}`, { stats: true });
    return p && (p.statistics || p.stats || (p.session_count != null ? { subjects: p.subject_count, sessions: p.session_count } : null));
  }

  window.PSD_LIVE = { loadSite, loadProject, refreshStats, makeApi };
})();

      data: { sessions: st.sessions || 0, recent: 0, last: null, missing_total: 0, sites_total: 0 }, tasks: { used: false }, compute: { failed: 0, pending_total: 0, running: 0 },
      live: { since: now, fetched_at: now, sessions_new: 0, jobs_new: 0, failed_new: 0, reads_completed_new: 0, failures: [] } };
  }
  function Diagnostics({ log, notes, sample }) {

    return h('div', { className: 'psd-diag' },

  function App({ boot }) {
    const [theme, setTheme] = useState(store.get('psd-theme') || 'dark');
    const [persona, setPersona] = useState(store.get('psd-persona') || 'all');
    const [info, setInfo] = useState(false);
    const [facts, setFacts] = useState(boot.facts || null);
    const [progress, setProgress] = useState(null);
    const [failure, setFailure] = useState(null);
    const [log, setLog] = useState([]);
    const [notes, setNotes] = useState([]);
    const [sample, setSample] = useState({});
    const [now, setNow] = useState(boot.now);
    const live = boot.mode === 'live';
    const route = useRoute();
    const apiRef = useRef(null);
    useEffect(() => {
      document.documentElement.setAttribute('data-mode', theme);
      document.documentElement.classList.toggle('vision-dark', theme === 'dark');
      store.set('psd-theme', theme);
    }, [theme]);
    useEffect(() => { store.set('psd-persona', persona); }, [persona]);

    // live: load every visible project once, then keep the open project fresh
    useEffect(() => {
      if (!live) return;
      const entries = [];
      const logger = e => { entries.push(e); setLog([...entries]); };
      logger.sample = {};
      const ctx = { now: Date.now(), openedAt: boot.openedAt, options: { ...PSDL.DEFAULTS, ...(boot.options || {}) } };
      const show = ({ results, siteNotes, api }, partial) => {
          apiRef.current = { api, ctx, results };
          const fs = results.map(r => r.facts || stubFacts(r.project, r.tooBig || `Could not load: ${r.error}`, ctx.now));
          setNotes([...siteNotes, ...results.flatMap(r => (r.notes || []).map(n => `${r.project.label}: ${n}`)), ...results.filter(r => r.error).map(r => `${r.project.label}: ${r.error}`)]);
          setFacts(fs); setNow(Date.now());
          setSample({ ...logger.sample });
          if (!location.hash && boot.projectId && fs.some(f => f.project._id === boot.projectId)) go(`#p-${boot.projectId}-overview`);
          if (!partial) setProgress(null);
      };
      // Show the project it was launched from as soon as it loads; the rest fill in behind it.
      PSD_LIVE.loadSite(boot.ext, ctx, logger, (n, of) => setProgress({ n, of }), { priorityPid: boot.projectId, onPartial: res => { if (res.results.some(r => r.project._id === boot.projectId) || !boot.projectId) show(res, true); } })
        .then(res => show(res, false))
        .catch(e => setFailure(e.message || String(e)));
    }, []);
    useEffect(() => {
      if (!live || !facts) return;
      let busy = false, last = 0;
      const refresh = async () => {
        const r = parseHash(); const ref = apiRef.current;
        if (busy || !ref || r.view !== 'project' || Date.now() - last < 4000) return;
        busy = true; last = Date.now();
        try {
          const p = ref.results.find(x => x.project._id === r.pid);
          if (!p) return;
          const stats = await PSD_LIVE.refreshStats(ref.api, r.pid).catch(() => null);
          const proj = { ...p.project, statistics: stats || p.project.statistics };
          const res = p.facts ? await PSD_LIVE.loadProject(ref.api, proj, { ...ref.ctx, now: Date.now() }) : { tooBig: p.tooBig };
          const nf = res.facts || stubFacts(proj, res.tooBig || p.tooBig, Date.now());
          // A transient failure on refresh must not blank totals that loaded before.
          setFacts(prev => prev.map(f => { if (f.project._id !== r.pid) return f; const o = f.statistics || {}, n = nf.statistics || {};
            for (const k of ['acquisitions', 'acquisition_files', 'analyses']) if (n[k] == null && o[k] != null) n[k] = o[k]; nf.statistics = n; return f; }));
          setFacts(prev => prev.map(f => (f.project._id === r.pid ? nf : f))); setNow(Date.now());
        } finally { busy = false; }
      };
      const iv = setInterval(refresh, 60000);
      const onVis = () => { if (document.visibilityState === 'visible') refresh(); };
      document.addEventListener('visibilitychange', onVis); window.addEventListener('focus', onVis);
      return () => { clearInterval(iv); document.removeEventListener('visibilitychange', onVis); window.removeEventListener('focus', onVis); };
    }, [live, !!facts]);

    const sums = useMemo(() => (facts || []).map(f => ({ f, a: PSDL.assess(f, boot.options, now) })), [facts, now]);
    const current = route.view === 'project' ? sums.find(s => s.f.project._id === route.pid) : null;
    const tab = route.tab || 'overview';
    const open = (pid, lens) => go(`#p-${pid}-${lens && lens !== 'all' ? lens : 'overview'}`);
    const siteLabel = live ? boot.site : `Group ${boot.group.label}`;

    const header = h('header', { className: 'psd-top' },
      h('div', { className: 'psd-title' },
        h('img', { className: 'psd-mark', src: boot.markSrc, alt: '', width: 24, height: 24 }),
        h('div', null, h(Typography, { variant: 'h3' }, 'Project Status'), h(Typography, { variant: 'p4', color: 'light' }, `${siteLabel} · ${facts ? sums.length : '…'} projects${facts && progress && progress.n < progress.of ? ` (loading ${progress.n} of ${progress.of}…)` : ''}`)),
        live ? h(Tag, { color: 'green', icon: 'server-checkmark', title: 'Live · read-only', size: 'large' }) : h(Tag, { color: 'orange', icon: 'test-lab-flask', title: 'Demo data', size: 'large' })),
      h('div', { className: 'psd-actions' },
        h('label', { className: 'psd-viewas' }, h(Typography, { variant: 'p4', color: 'muted' }, 'View as'),
          h(Select, { name: 'persona', value: persona, onChange: setPersona, size: 'compact', width: 190, 'aria-label': 'View as' },
            h(SelectItem, { value: 'all' }, 'All roles'),
            Object.keys(LENS).map(k => h(SelectItem, { key: k, value: k }, LENS[k].persona)))),
        h(IconButton, { icon: 'information-circle', size: 'small', color: 'slate', selected: info, 'aria-label': 'Info', title: 'Info, About and Diagnostics', onClick: () => setInfo(!info) }),
        h(IconButton, { icon: 'moon-night-mode', size: 'small', color: 'slate', selected: theme === 'dark', 'aria-label': theme === 'dark' ? 'Light mode' : 'Dark mode', onClick: () => setTheme(theme === 'dark' ? 'light' : 'dark') })));

    let body;
    if (failure) body = h('div', { className: 'psd-body' }, h(AlertPanel, { severity: 'error', icon: 'warning-circle', title: 'Couldn’t load projects', description: `${failure}. Open Info › Diagnostics for the failing call.` }));
    else if (!facts) body = h('div', { className: 'psd-body' }, h(ContextLayout, { icon: 'clock-loading', title: 'Loading projects',
      description: progress ? `Read ${progress.n} of ${progress.of} projects (sessions, jobs, gear rules, reader tasks). Large projects show live totals only.` : 'Listing projects you can see…' }));
    else if (route.view === 'project' && !current) body = h('div', { className: 'psd-body' }, h(ContextLayout, { icon: 'folder-blank', title: 'Project not found', description: 'It may have been removed or you may not have access.' }, h(Button, { onClick: () => go('#projects') }, 'All projects')));
    else if (current && current.f.stub) body = h(StubView, { s: current });
    else if (current) body = h(ProjectView, { s: current, tab, persona, now });
    else body = h(Portfolio, { sums, persona, now, onOpen: open });

    const ctx = { group: siteLabel, viewing: current ? current.f.project.label : 'All projects', persona: persona === 'all' ? 'All roles' : LENS[persona].persona, live, user: boot.user };
    return h('div', { className: 'psd-shell' + (info ? ' with-info' : '') },
      header,
      h('div', { className: 'psd-main' },
        h('main', { className: 'psd-content' }, body,
          h('footer', { className: 'psd-foot' }, `${BUILD.app}/${BUILD.version} · ${live ? 'live harness · ' + boot.site : 'prototype · demo data'} · read-only`)),
        info && h(InfoPanel, { ctx, sel: current && !current.f.stub ? current : null, now, onClose: () => setInfo(false), diag: live ? h(Diagnostics, { log, notes, sample }) : null })));
  }

  function StubView({ s }) {
    const st = s.f.statistics;
    return h('div', { className: 'psd-body' },
      h('div', { className: 'psd-crumb' }, h('a', { href: '#projects' }, 'All projects')),
      h(Typography, { variant: 'h2' }, s.f.project.label),
      h('div', { className: 'psd-statline' }, [['Subjects', st.subjects], ['Sessions', st.sessions], ['Acquisitions', st.acquisitions], ['Acquisition files', st.acquisition_files], ['Analyses', st.analyses], ['Jobs', st.jobs]]
        .map(([k, v]) => h('div', { key: k }, h('b', null, fmtNum(v)), h('span', null, k))), h(SrcMark, { src: 'live' })),
      h(AlertPanel, { severity: 'info', icon: 'information-circle', title: 'Live totals only', description: s.f.stub }));
  }

  async function start() {
    const rootEl = document.getElementById('root');
    const markSrc = document.getElementById('fw-mark').getAttribute('src');
    const params = new URLSearchParams(location.search);
    const embedded = window.top !== window;
    const demo = () => {
      const now = Date.now();
      const raw = window.PSD_DEMO.build(now);
      const facts = raw.projects.map(p => { const rec = raw.byProject[p._id]; const fct = PSDL.buildFacts(rec, now); fct.generated_at = now - rec.snapshotAgeMin * 60000; return fct; });
      raw.projects.forEach((p, i) => { facts[i].live = window.PSD_DEMO.liveDelta(raw.byProject[p._id], facts[i].generated_at, now); });
      const big = window.PSD_DEMO.scaleFacts(now); big.live = window.PSD_DEMO.scaleLive(big, now);
      facts.push(big);
      return { mode: 'demo', now, group: raw.group, facts, options: {}, markSrc };
    };
    if (!embedded || params.has('demo')) { ReactDOM.createRoot(rootEl).render(h(App, { boot: demo() })); return; }
    // Inside Flywheel: never fall back to demo data.
    if (!window.Flywheel) {
      ReactDOM.createRoot(rootEl).render(h('div', { className: 'psd-body' }, h(AlertPanel, { severity: 'error', icon: 'warning-circle', title: 'Flywheel Extension SDK did not load', description: 'No data is shown. Reload; if it persists, check the browser console.' })));
      return;
    }
    try {
      window.FW_CHROME = window.FW_CHROME || { /* Custom Apps note claude/extension-dialog-sizing-note.md */ fullWidth: true, hideHostClose: false,
        initOptions(o) { if (this.hideHostClose) o.hideCloseButton = true; return o; },
        apply(ext) { const d = document.documentElement; d.classList.add('fw-embedded'); if (this.hideHostClose) d.classList.add('fw-own-close');
          if (this.fullWidth && ext && typeof ext.updateViewport === 'function') { try { ext.updateViewport({ width: '100vw' }); } catch (e) { console.warn('updateViewport failed', e); } } } };
      const ext = await Promise.race([
        window.Flywheel.initExtension(FW_CHROME.initOptions({ scope: 'ReadOnly' })),
        new Promise((_, rej) => setTimeout(() => rej(new Error('No answer from Flywheel within 15 s')), 15000)),
      ]);
      FW_CHROME.apply(ext);
      const c = ext.container || {};
      const ctype = c.container_type || c.type || null;
      const cid = c._id || c.id || null;
      const pid = ctype === 'project' ? cid : (c.parents && c.parents.project) || null;
      let site = 'Flywheel';
      try { site = new URL(document.referrer).hostname.split('.')[0] || site; } catch (e) { /* no referrer */ }
      const u = ext.user || {};
      ReactDOM.createRoot(rootEl).render(h(App, { boot: { mode: 'live', ext, now: Date.now(), openedAt: Date.now(), site, projectId: pid,
        user: u._id || u.id || u.email || '—', options: { ...(ext.params || {}) }, markSrc, group: { label: site } } }));
    } catch (e) {
      ReactDOM.createRoot(rootEl).render(h('div', { className: 'psd-body' }, h(AlertPanel, { severity: 'error', icon: 'warning-circle', title: 'Couldn’t connect to Flywheel', description: `${e.message || e}. Close this window and launch the app again.` })));
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
</body>
</html>
